<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Darbs notiek – Waze Latvija</title>
  <meta name="robots" content="noindex, nofollow">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      darkMode: 'class',
      theme: { extend: { colors: { waze: '#0099FF', latvia: '#9E3039' } } }
    }
  </script>
</head>
<body class="bg-white text-slate-900 min-h-screen flex flex-col">

  <!-- Minimal header -->
  <header class="border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 font-bold text-lg">
          <img src="assets/logo.png" alt="Waze Latvija" class="h-10 w-auto" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline'">
          <span class="text-2xl" style="display:none">🚗</span>
          <span class="text-waze">Waze</span>
          <span class="text-latvia">Latvija</span>
        </a>
      <button id="dark-mode-toggle" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-xl" aria-label="Toggle dark mode">🌙</button>
    </div>
  </header>

  <!-- Main content -->
  <main class="flex-1 flex items-center justify-center px-4 py-16">
    <div class="text-center max-w-lg">
      <div class="text-6xl mb-6">🚧</div>
      <h1 class="text-3xl md:text-4xl font-bold mb-4">
        <span data-lang="lv">Darbs notiek</span>
        <span data-lang="en">Work in Progress</span>
      </h1>
      <p class="text-slate-600 mb-8 text-lg">
        <span data-lang="lv">Mēs veidojam un uzlabojam Waze Latvija mājaslapu. Drīzumā atgriezīsimies!</span>
        <span data-lang="en">We are building and improving the Waze Latvia website. We'll be back soon!</span>
      </p>

      <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
        <a href="https://www.facebook.com/WazeLV" target="_blank" rel="noopener"
           class="inline-flex items-center gap-2 btn-primary px-6 py-3 rounded-xl font-medium">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          Facebook @WazeLV
        </a>
        <a href="mailto:wazelatvia@gmail.com" class="text-waze font-medium hover:underline">
          wazelatvia@gmail.com
        </a>
      </div>
    </div>
  </main>

  <footer class="border-t border-slate-200 py-6 text-center text-sm text-slate-500">
    © 2026 Waze Latvija Community · wazers.lv
  </footer>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
